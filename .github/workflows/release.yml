# Builds the Windows helper (MotionRadar.exe, zipped) and attaches it to a GitHub
# release. Runs when a version tag such as v0.2.0 is pushed, or by hand.
name: Helper

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard the helper serves offline
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Install
        run: python -m pip install ".[dev,sonar]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build MotionRadar.exe
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Publish
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG build/MotionRadar-windows.zip --clobber
          } else {
            gh release create $env:TAG build/MotionRadar-windows.zip --title "Motion Radar $env:TAG" --notes-file packaging/RELEASE_NOTES.md
          }
